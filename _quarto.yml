project:
  type: website
  output-dir: docs
  render:
    - reports/overview.qmd
    - reports/analysis.qmd
    - reports/data-dictionary.qmd
    - reports/methodology.qmd
  resources:
    - reports/scripts/site.js

website:
  title: "Trade Winds & Headwinds"
  description: "Twenty-Five Years of Tourism and Economic Change in the U.S. Virgin Islands"
  site-url: "https://johbry17.github.io/Trade-Winds-and-Headwinds/"
  favicon: "images/favicon.png"
  # image: "images/open-graph.png"
  # image-alt: "Trade Winds & Headwinds — Tourism and Economic Change in the U.S. Virgin Islands"
  open-graph: true
  twitter-card: true
  back-to-top-navigation: true
  navbar:
    left:
      - href: reports/overview.qmd
        text: Overview
      - href: reports/analysis.qmd
        text: Analysis
      - href: reports/methodology.qmd
        text: Methods
      - href: reports/data-dictionary.qmd
        text: Data
    right:
      - icon: github
        href: https://github.com/johbry17/Trade-Winds-and-Headwinds
  sidebar: false
  page-footer:
    left: "Data sources: USVIBER, FRED, BLS, BEA, U.S. Census Bureau, NPS, World Bank"
    center: "© <span id='copyright-year'>2026</span> Bryan C. Johns"
    right:
      - text: Portfolio
        href: https://informedwanderer.com
      - text: LinkedIn
        href: https://www.linkedin.com/in/b-johns/
      - text: GitHub
        href: https://github.com/johbry17

format:
  html:
    author-meta: "Bryan C. Johns"
    theme:
      light: [cosmo, reports/themes/archipelago-light.scss]
      dark: [darkly, reports/themes/archipelago-dark.scss]
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: false
    fig-width: 9
    fig-height: 5.5
    fig-dpi: 150
    embed-resources: false
    smooth-scroll: true
    include-after-body: # site.js for copyright year & back-to-top smooth scroll
      - text: |
          <script src="scripts/site.js"></script>

execute:
  freeze: auto
  cache: true

jupyter: python3
