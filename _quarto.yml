project:
  type: website
  output-dir: docs
  render:
    - reports/index.qmd
    - reports/eda.qmd
    - reports/data-dictionary.qmd
    - reports/methodology.qmd
  resources: 
    - src/charts.py
    - src/cleaning.py

website:
  title: "Trade Winds & Headwinds"
  description: "Twenty-Five Years of Tourism and Economic Change in the U.S. Virgin Islands"
  # site-url: "https://johbry17.github.io/Trade-Winds-and-Headwinds/"
  favicon: "images/favicon.png"
  # image: "images/open-graph.png"
  # image-alt: "Trade Winds & Headwinds — Tourism and Economic Change in the U.S. Virgin Islands"
  # open-graph: true
  # twitter-card: true
  navbar:
    left:
      - href: reports/index.qmd
        text: Overview
      - href: reports/eda.qmd
        text: Analysis
      - href: reports/data-dictionary.qmd
        text: Data
      - href: reports/methodology.qmd
        text: Methods
    right:
      - icon: github
        href: https://github.com/johbry17/Trade-Winds-and-Headwinds
  sidebar: false
  page-footer:
    left: "Data sources: USVIBER, FRED, NPS, U.S. Census Bureau, BEA, World Bank"
    center: "© {{< current-year >}} Bryan C. Johns"
    right:
      - text: Portfolio
        href: https://informedwanderer.com
      - text: LinkedIn
        href: https://www.linkedin.com/in/b-johns/
      - text: GitHub
        href: https://github.com/johbry17

format:
  html:
    author-meta: "Bryan C. Johns"
    shortcodes: 
      - year.lua
    theme:
      light: [cosmo, reports/custom.scss]
      dark: solar
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: false
    fig-width: 9
    fig-height: 5.5
    fig-dpi: 150
    embed-resources: false

execute:
  freeze: auto
  cache: true

jupyter: python3
